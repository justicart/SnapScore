<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f221b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SnapScore Cards</title>
    <style>
      :root {
        /* Base Canvas (Slate-950) */
        --c-canvas: 2 6 23; 
        
        /* Surface (Slate-800) */
        --c-surface: 30 41 59; 
        
        /* Surface Highlight (Slate-700) */
        --c-surface-highlight: 51 65 85; 
        
        /* Surface Dark (Slate-900) */
        --c-surface-dark: 15 23 42;

        /* Ink (Slate-100) */
        --c-ink: 241 245 249;
        
        /* Ink Muted (Slate-400) */
        --c-ink-muted: 148 163 184;
        
        /* Ink Subtle (Slate-600) */
        --c-ink-subtle: 71 85 105;

        /* Primary (Emerald-500) */
        --c-primary: 16 185 129;
        
        /* Primary Soft (Emerald-400) */
        --c-primary-soft: 52 211 153;
        
        /* Primary Deep (Emerald-900) */
        --c-primary-deep: 6 78 59;

        /* Danger (Red-500) */
        --c-danger: 239 68 68;
        
        /* Danger Soft (Red-400) */
        --c-danger-soft: 248 113 113;
        
        /* Danger Deep (Red-900) */
        --c-danger-deep: 127 29 29;

        /* Accent (Gold-400) */
        --c-accent: 251 191 36;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              canvas: 'rgb(var(--c-canvas) / <alpha-value>)',
              surface: {
                DEFAULT: 'rgb(var(--c-surface) / <alpha-value>)',
                highlight: 'rgb(var(--c-surface-highlight) / <alpha-value>)',
                dark: 'rgb(var(--c-surface-dark) / <alpha-value>)',
              },
              ink: {
                DEFAULT: 'rgb(var(--c-ink) / <alpha-value>)',
                muted: 'rgb(var(--c-ink-muted) / <alpha-value>)',
                subtle: 'rgb(var(--c-ink-subtle) / <alpha-value>)',
              },
              primary: {
                DEFAULT: 'rgb(var(--c-primary) / <alpha-value>)',
                soft: 'rgb(var(--c-primary-soft) / <alpha-value>)',
                deep: 'rgb(var(--c-primary-deep) / <alpha-value>)',
              },
              danger: {
                DEFAULT: 'rgb(var(--c-danger) / <alpha-value>)',
                soft: 'rgb(var(--c-danger-soft) / <alpha-value>)',
                deep: 'rgb(var(--c-danger-deep) / <alpha-value>)',
              },
              accent: {
                DEFAULT: 'rgb(var(--c-accent) / <alpha-value>)',
              },
              // Keep legacy for safety if needed, or mapped to new ones
              felt: {
                800: 'rgb(var(--c-canvas) / <alpha-value>)', // Map to canvas for fallback
                900: 'rgb(var(--c-canvas) / <alpha-value>)',
              },
              gold: {
                 400: 'rgb(var(--c-accent) / <alpha-value>)',
                 500: '#f59e0b',
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'wiggle': 'wiggle 0.3s linear infinite',
            },
            keyframes: {
              wiggle: {
                '0%, 100%': { transform: 'rotate(-1deg)' },
                '50%': { transform: 'rotate(1deg)' },
              }
            }
          },
        },
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "peerjs": "https://esm.sh/peerjs@1.5.2",
    "qrcode": "https://esm.sh/qrcode@1.5.3",
    "jsqr": "https://esm.sh/jsqr@1.4.0"
  }
}
</script>
</head>
  <body class="bg-canvas text-ink h-[100dvh] overflow-hidden overscroll-none selection:bg-primary/30">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
